<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Wheel preview</title>
    <style> body { margin: 0; display: grid; place-items: center; min-height: 100vh; background: #1b1b22; } button { position: fixed; top: 12px; left: 12px; z-index: 10; } </style>
  </head>
  <body>
    <button id="spin">Spin</button>
    <script src="./sample-fielddata.js"></script>
    <script src="../dist/wheel.js"></script>
    <script>
      const handle = window.Wheel.mountWidget(document, { fieldData: window.__SAMPLE_FIELDDATA__ });
      document.getElementById("spin").addEventListener("click", () => handle.spin && handle.spin());
    </script>
  </body>
</html>
